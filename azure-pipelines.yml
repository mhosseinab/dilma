trigger:
- master

resources:
- repo: self

variables:
  containerRegistry: 'go7-registry'
  tag: '$(Build.BuildId)'

stages:
- stage: DeployAPI
  displayName: Deploy API
  jobs:
  - job: Deploy
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: SSH@0
      displayName: Deploy FastAPI via SSH
      inputs:
        sshEndpoint: 'hetzner-dev-ssh'
        runOptions: 'inline'
        inline: |
          HOME=/root
          PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin
          cd /srv/src/dilma/
          git pull origin master
          docker compose build api && docker compose up -d api
        readyTimeout: '60000'

- stage: DeployWeb
  displayName: Deploy Web
  dependsOn: DeployAPI
  jobs:
  - job: Build
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: Docker@2
      displayName: Login to registry
      inputs:
        command: login
        containerRegistry: $(containerRegistry)
    - task: Docker@2
      displayName: Build and push web image
      inputs:
        command: buildAndPush
        dockerfile: apps/web/Dockerfile
        repository: dilmaa-ui
        containerRegistry: $(containerRegistry)
        tags: |
          $(tag)
          latest
    - task: Docker@2
      displayName: Logout
      inputs:
        command: logout
        containerRegistry: $(containerRegistry)
    - task: SSH@0
      displayName: Deploy web container
      inputs:
        sshEndpoint: 'hetzner-dev-ssh'
        runOptions: 'inline'
        inline: |
          docker pull docker-registry.go7.ir/dilmaa-ui:latest
          docker stop dilmaa-web || true && docker rm dilmaa-web || true
          docker run -d -p 127.0.0.1:3001:3000 --restart=always \
            -e NEXT_PUBLIC_API_URL=https://dilmaa-api.go7.ir \
            --name dilmaa-web docker-registry.go7.ir/dilmaa-ui:latest
        readyTimeout: '20000'
